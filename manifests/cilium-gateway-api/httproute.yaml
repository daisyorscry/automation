apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: cilium-ingress
spec:
  parentRefs:
  - name: public-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: default
spec:
  parentRefs:
  - name: public-gateway
    namespace: cilium-ingress
    sectionName: https
  hostnames:
  - app.example.test
  rules:
  - backendRefs:
    - name: app
      port: 80
