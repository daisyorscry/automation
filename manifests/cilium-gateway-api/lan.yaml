apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: ingress-lan
spec:
  blocks:
    - start: "192.168.10.10"
      stop: "192.168.10.20"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: cilium-ingress
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: ingress-lan
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: cilium-ingress
  loadBalancerIPs: true
