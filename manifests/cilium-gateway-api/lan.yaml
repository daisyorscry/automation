apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-lan
spec:
  blocks:
    - start: "192.168.10.10"
      stop: "192.168.10.20"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: cilium-gateway
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-lan
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: cilium-gateway
  loadBalancerIPs: true
