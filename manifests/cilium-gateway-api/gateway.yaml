apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: cilium-gateway
  labels:
    automation.daisyorscry.io/gateway-set: public
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    hostname: '*.example.test'
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    hostname: '*.example.test'
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: gateway-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: default
  addresses:
  - type: IPAddress
    value: 192.168.10.10
